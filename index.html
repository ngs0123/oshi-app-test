<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9fb">
<title>推し登録フロー Prototype</title>
<style>
:root{
  --bg:#fff9fb; --card:#fff; --ink:#262227; --muted:#8f858d;
  --line:#eee5ea; --accent:#4ac86e; --accent-rgb:74,200,110;
  --soft:rgba(var(--accent-rgb),.10); --shadow:0 10px 28px rgba(60,35,52,.08);
}
*{box-sizing:border-box}
body{
  margin:0;background:
    radial-gradient(circle at 20% -5%,rgba(var(--accent-rgb),.10),transparent 30%),
    var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:82px}
.top{
  position:sticky;top:0;z-index:20;padding:14px 16px 11px;
  background:rgba(255,249,251,.90);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted)}
.topBtn{border:0;background:var(--soft);color:var(--accent);border-radius:13px;padding:9px 12px;font-weight:700}
.screen{display:none;padding:14px}.screen.active{display:block}
.empty{
  min-height:60dvh;display:grid;place-items:center;text-align:center;padding:30px
}
.emptyIcon{width:84px;height:84px;border-radius:28px;background:var(--soft);display:grid;place-items:center;font-size:38px;margin:auto}
.primary{
  border:0;background:var(--accent);color:#fff;border-radius:16px;padding:13px 16px;font-weight:800;
  box-shadow:0 10px 24px rgba(var(--accent-rgb),.22)
}
.secondary{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;color:#645b61}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0;box-shadow:var(--shadow)
}
.oshiCardBtn{width:100%;border:0;background:transparent;padding:0;text-align:left;color:inherit}
.oshiRow{display:flex;align-items:center;gap:12px}
.avatar{
  flex:0 0 auto;width:66px;height:66px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--soft),#eee);
  display:grid;place-items:center;border:3px solid var(--accent);font-weight:900;font-size:22px
}
.avatar img{width:100%;height:100%;object-fit:cover}
.oshiText{min-width:0;flex:1}
.oshiName{font-size:19px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.colorline{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:1px solid rgba(0,0,0,.08)}
.chev{font-size:22px;color:#aaa}

.formTitle{font-size:24px;font-weight:850;margin:4px 0 2px}
.hint{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:14px}
.field{margin:15px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.optional{font-size:11px;color:#aaa;font-weight:500;margin-left:4px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:12px 13px;
  outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.field textarea{min-height:90px;resize:vertical}
.imagePick{
  display:flex;gap:12px;align-items:center;padding:12px;border:1px dashed #d9ccd4;border-radius:18px;background:#fff
}
.preview{
  width:74px;height:74px;border-radius:23px;overflow:hidden;background:#f3edf1;display:grid;place-items:center;font-size:26px
}
.preview img{width:100%;height:100%;object-fit:cover}
.fileLabel{display:inline-block;background:#f8f2f5;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:700}
input[type=file]{display:none}
.colorBox{display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center}
input[type=color]{width:82px;height:54px;padding:4px;border-radius:14px}
.toggleRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.toggleRow:last-child{border-bottom:0}
.switch{position:relative;width:48px;height:28px}
.switch input{display:none}
.slider{position:absolute;inset:0;background:#ddd;border-radius:999px;transition:.2s}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 5px #aaa}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(20px)}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:22px}

.detailHero{
  border-radius:26px;padding:18px;background:
    radial-gradient(circle at 85% 0,var(--soft),transparent 38%),#fff;border:1px solid var(--line);box-shadow:var(--shadow)
}
.bigAvatar{width:94px;height:94px;border-radius:30px;overflow:hidden;border:4px solid var(--accent);background:#f3edf1;display:grid;place-items:center;font-size:30px;font-weight:900}
.bigAvatar img{width:100%;height:100%;object-fit:cover}
.detailName{font-size:28px;font-weight:900;margin-top:12px}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11px;margin:6px 5px 0 0}
.info{padding:12px 0;border-bottom:1px solid var(--line)}
.info:last-child{border-bottom:0}
.info b{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.back{border:0;background:transparent;color:var(--accent);padding:2px 0;font-weight:800}
.notice{font-size:12px;line-height:1.55;background:#fff7df;border:1px solid #f3e5aa;border-radius:15px;padding:11px;color:#806b30}
.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);
  display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(15px);
  border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:30
}
.bottom button{border:0;background:transparent;color:#988e95}
.bottom button.active{color:var(--accent);font-weight:800}
.bottom span{display:block;font-size:20px}.bottom small{font-size:11px}
.error{font-size:12px;color:#d54e61;margin-top:6px;display:none}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="toprow">
    <div>
      <h1 id="headerTitle">推し一覧</h1>
      <div class="sub" id="headerSub">登録 → 一覧 → 詳細 を試せる版</div>
    </div>
    <button class="topBtn" id="addTop" onclick="openForm()">＋ 登録</button>
  </div>
</header>

<main>
  <section id="listScreen" class="screen active">
    <div id="listContent"></div>
  </section>

  <section id="formScreen" class="screen">
    <button class="back" onclick="showList()">‹ 推し一覧</button>
    <div class="formTitle">推しを登録</div>
    <div class="hint">名前だけでも保存できるっしょ。分かる情報・残したい情報だけ入れて、あとから追加できる想定。</div>

    <div class="field">
      <label>名前</label>
      <input id="name" placeholder="例：安嶋秀生">
      <div class="error" id="nameError">名前だけは入れてほしいっしょ！</div>
    </div>

    <div class="field">
      <label>アイコン画像 <span class="optional">任意</span></label>
      <div class="imagePick">
        <div class="preview" id="iconPreview">＋</div>
        <div>
          <label class="fileLabel" for="iconFile">画像を選ぶ</label>
          <input id="iconFile" type="file" accept="image/*">
          <div class="sub" style="margin-top:6px">写真・ファイルから選択</div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>種類 <span class="optional">任意</span></label>
      <select id="type">
        <option value="">未設定</option>
        <option>人物</option>
        <option>グループ</option>
        <option>キャラクター</option>
        <option>作品</option>
        <option>その他</option>
      </select>
    </div>

    <div class="field">
      <label>所属事務所 / プロジェクト <span class="optional">任意</span></label>
      <input id="agency" placeholder="例：STARTO ENTERTAINMENT">
    </div>

    <div class="field">
      <label>区分 <span class="optional">任意</span></label>
      <input id="category" placeholder="例：ジュニア / 女性アイドル / ゲームキャラ">
    </div>

    <div class="field">
      <label>現在のグループ <span class="optional">任意</span></label>
      <input id="group" placeholder="所属なし、FRUITS ZIPPER など">
    </div>

    <div class="field">
      <label>過去所属 <span class="optional">任意</span></label>
      <input id="pastGroup" placeholder="例：少年忍者">
    </div>

    <div class="field">
      <label>公式メンバーカラー <span class="optional">任意</span></label>
      <div class="colorBox">
        <input id="color" type="color" value="#31b76a">
        <div>
          <input id="colorName" placeholder="例：エメラルドグリーン">
          <div class="sub" style="margin-top:5px">色名と実際の色を別々に持てる想定</div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>カラー情報メモ <span class="optional">任意</span></label>
      <input id="colorMemo" placeholder="例：公式ペンライト6番 / 公式資料からスポイト">
    </div>

    <div class="field">
      <label>推し始めた日 <span class="optional">任意</span></label>
      <input id="startDate" type="date">
    </div>

    <div class="card" style="box-shadow:none">
      <div class="toggleRow">
        <div><b style="font-size:13px">当日を1日目として数える</b><div class="sub">OFFなら当日＝0日</div></div>
        <label class="switch"><input id="countOne" type="checkbox" checked><span class="slider"></span></label>
      </div>
    </div>

    <div class="field">
      <label>メモ <span class="optional">任意</span></label>
      <textarea id="memo" placeholder="好きなところ、きっかけ、URLなど何でも"></textarea>
    </div>

    <div class="actions">
      <button class="secondary" onclick="showList()">キャンセル</button>
      <button class="primary" onclick="saveOshi()">保存</button>
    </div>
  </section>

  <section id="detailScreen" class="screen">
    <button class="back" onclick="showList()">‹ 推し一覧</button>
    <div id="detailContent"></div>
  </section>
</main>

<nav class="bottom">
  <button class="active" onclick="showList()"><span>💗</span><small>推し</small></button>
  <button onclick="alert('現場記録は前の試作につなぐ想定')"><span>🎫</span><small>現場</small></button>
  <button onclick="alert('設定画面は今後')"><span>⚙️</span><small>設定</small></button>
</nav>
</div>

<script>
let iconData = "";
let oshis = JSON.parse(localStorage.getItem("oshiPrototypeData") || "[]");

function el(id){return document.getElementById(id)}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function applyColor(hex){
  document.documentElement.style.setProperty("--accent",hex || "#31b76a");
  const h=(hex||"#31b76a").replace("#","");
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  document.documentElement.style.setProperty("--accent-rgb",`${r},${g},${b}`);
}
function show(screen){
  ["listScreen","formScreen","detailScreen"].forEach(x=>el(x).classList.remove("active"));
  el(screen).classList.add("active");
  el("addTop").style.display = screen==="listScreen" ? "block" : "none";
  window.scrollTo({top:0,behavior:"smooth"});
}
function showList(){
  applyColor("#31b76a");
  el("headerTitle").textContent="推し一覧";
  el("headerSub").textContent="登録 → 一覧 → 詳細 を試せる版";
  renderList();
  show("listScreen");
}
function openForm(){
  resetForm();
  applyColor("#31b76a");
  el("headerTitle").textContent="新規登録";
  el("headerSub").textContent="ほぼ全部任意入力";
  show("formScreen");
}
function resetForm(){
  ["name","agency","category","group","pastGroup","colorName","colorMemo","memo"].forEach(id=>el(id).value="");
  el("type").value="";
  el("startDate").value="";
  el("countOne").checked=true;
  el("color").value="#31b76a";
  el("nameError").style.display="none";
  iconData="";
  el("iconPreview").innerHTML="＋";
}
el("iconFile").addEventListener("change", e=>{
  const file=e.target.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    iconData=reader.result;
    el("iconPreview").innerHTML=`<img src="${iconData}" alt="">`;
  };
  reader.readAsDataURL(file);
});
el("color").addEventListener("input", e=>applyColor(e.target.value));

function saveOshi(){
  const name=el("name").value.trim();
  if(!name){
    el("nameError").style.display="block";
    el("name").focus(); return;
  }
  const o={
    id:Date.now(),
    name,
    icon:iconData,
    type:el("type").value,
    agency:el("agency").value.trim(),
    category:el("category").value.trim(),
    group:el("group").value.trim(),
    pastGroup:el("pastGroup").value.trim(),
    color:el("color").value,
    colorName:el("colorName").value.trim(),
    colorMemo:el("colorMemo").value.trim(),
    startDate:el("startDate").value,
    countOne:el("countOne").checked,
    memo:el("memo").value.trim()
  };
  oshis.push(o);
  localStorage.setItem("oshiPrototypeData",JSON.stringify(oshis));
  showList();
}

function initials(name){
  return name.slice(0,2);
}
function countDays(o){
  if(!o.startDate)return "";
  const s=new Date(o.startDate+"T00:00:00");
  const t=new Date();
  const d=Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-s)/86400000);
  return d+(o.countOne?1:0);
}
function renderList(){
  const c=el("listContent");
  if(!oshis.length){
    c.innerHTML=`<div class="empty"><div>
      <div class="emptyIcon">💗</div>
      <h2>まだ推しがいません</h2>
      <p class="hint">まず1人登録して、一覧と詳細でどう見えるか試してみるっしょ。</p>
      <button class="primary" onclick="openForm()">＋ 推しを登録する</button>
    </div></div>`;
    return;
  }
  c.innerHTML=`<div class="sub" style="margin:3px 3px 10px">登録中の推し・${oshis.length}</div>`+
    oshis.map(o=>`
      <div class="card">
        <button class="oshiCardBtn" onclick="openDetail(${o.id})">
          <div class="oshiRow">
            <div class="avatar" style="border-color:${o.color}">
              ${o.icon?`<img src="${o.icon}" alt="">`:esc(initials(o.name))}
            </div>
            <div class="oshiText">
              <div class="oshiName">${esc(o.name)}</div>
              <div class="meta">${esc([o.group,o.category,o.agency].filter(Boolean).slice(0,2).join(" / ") || "詳細未設定")}</div>
              <div class="colorline">
                <span class="dot" style="background:${o.color}"></span>
                <span>${esc(o.colorName || "カラー名未設定")}</span>
                ${o.startDate?`<span>・${countDays(o)}日</span>`:""}
              </div>
            </div>
            <div class="chev">›</div>
          </div>
        </button>
      </div>
    `).join("");
}
function row(label,value){
  if(!value)return "";
  return `<div class="info"><b>${esc(label)}</b>${esc(value)}</div>`;
}
function openDetail(id){
  const o=oshis.find(x=>x.id===id); if(!o)return;
  applyColor(o.color);
  el("headerTitle").textContent=o.name;
  el("headerSub").textContent="プロフィール詳細";
  const days=o.startDate?countDays(o):null;
  el("detailContent").innerHTML=`
    <div class="detailHero">
      <div class="bigAvatar" style="border-color:${o.color}">
        ${o.icon?`<img src="${o.icon}" alt="">`:esc(initials(o.name))}
      </div>
      <div class="detailName">${esc(o.name)}</div>
      ${o.type?`<span class="tag">${esc(o.type)}</span>`:""}
      ${o.category?`<span class="tag">${esc(o.category)}</span>`:""}
      ${o.group?`<span class="tag">${esc(o.group)}</span>`:""}
      ${days!==null?`<div style="margin-top:16px"><span class="sub">推し始めて</span><div style="font-size:32px;font-weight:900">${days}日</div><div class="sub">当日＝${o.countOne?"1":"0"}日</div></div>`:""}
    </div>

    <div class="card">
      ${row("所属事務所 / プロジェクト",o.agency)}
      ${row("区分",o.category)}
      ${row("現在のグループ",o.group)}
      ${row("過去所属",o.pastGroup)}
      <div class="info">
        <b>公式メンバーカラー</b>
        <div class="colorline" style="margin:0">
          <span class="dot" style="width:20px;height:20px;background:${o.color}"></span>
          <span>${esc(o.colorName || "名称未設定")}</span>
        </div>
      </div>
      ${row("カラー情報",o.colorMemo)}
      ${row("推し始めた日",o.startDate)}
      ${row("メモ",o.memo)}
    </div>
    <div class="notice">空欄だった項目は詳細画面にも出さない仕様のサンプル。だから「登録した情報だけ見える」感じを確認できるっしょ。</div>
  `;
  show("detailScreen");
}
renderList();
</script>
</body>
</html>
